name: Zig cache experiment

# A branch push tests the cache without a release or a default-branch workflow.
on:
  push:
    branches:
      - hn/zig-cache-experiment

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    env:
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install verified Zig 0.17.0 at stable path
        shell: bash
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --output /tmp/zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo '1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  /tmp/zig.tar.xz' | sha256sum --check
          sudo mkdir -p /opt/hostedtoolcache/zig/0.17.0/x64
          sudo tar -xf /tmp/zig.tar.xz -C /opt/hostedtoolcache/zig/0.17.0/x64 --strip-components=1
          echo /opt/hostedtoolcache/zig/0.17.0/x64 >> "$GITHUB_PATH"
      - name: Restore and save Zig build cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .zig-cache
          key: zig-manual-v1-x86_64-linux-gnu.2.35-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-manual-v1-x86_64-linux-gnu.2.35-baseline-
      - name: Inspect restored Zig cache
        shell: bash
        run: |
          if test -d .zig-cache; then
            du -sh .zig-cache
            du -sh .zig-cache/* 2>/dev/null || true
          else
            echo 'No Zig build cache restored'
          fi
      - name: Build native module with vendored Emacs 32 header
        shell: bash
        run: |
          TIMEFORMAT='First build elapsed: %R seconds'
          time zig build -Doptimize=ReleaseFast -Demacs-include-dir=vendor -Dtarget=x86_64-linux-gnu.2.35 -Dcpu=baseline --summary all
          printf 'ZIG_LOCAL_CACHE_DIR=%s\nZIG_GLOBAL_CACHE_DIR=%s\n' "${ZIG_LOCAL_CACHE_DIR:-unset}" "${ZIG_GLOBAL_CACHE_DIR:-unset}"
          du -sh .zig-cache 2>/dev/null || true
      - name: Repeat build on the same runner
        shell: bash
        run: |
          TIMEFORMAT='Second build elapsed: %R seconds'
          time zig build -Doptimize=ReleaseFast -Demacs-include-dir=vendor -Dtarget=x86_64-linux-gnu.2.35 -Dcpu=baseline --summary all
      - name: Package module and checksum
        shell: bash
        run: |
          version=$(sed -n 's/^;; Version: \([0-9][0-9.]*\)$/\1/p' canvas-color-picker.el)
          test -n "$version"
          asset="canvas-color-picker-module-v${version}-linux-x86_64.so"
          cp zig-out/lib/canvas-color-picker-module.so "$asset"
          sha256sum "$asset" > "$asset.sha256"
          sha256sum --check "$asset.sha256"
          mkdir -p release-assets
          mv "$asset" "$asset.sha256" release-assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64
          path: release-assets/
          if-no-files-found: error
