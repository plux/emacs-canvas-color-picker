name: Zig cache experiment

# A branch push tests the cache without a release or a default-branch workflow.
on:
  push:
    branches:
      - hn/zig-cache-experiment

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Zig 0.17.0 with cache
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: x86_64-linux-gnu.2.35-baseline
      - name: Build native module with vendored Emacs 32 header
        shell: bash
        run: |
          TIMEFORMAT='Build elapsed: %R seconds'
          time zig build -Doptimize=ReleaseFast -Demacs-include-dir=vendor -Dtarget=x86_64-linux-gnu.2.35 -Dcpu=baseline --summary all
      - name: Package module and checksum
        shell: bash
        run: |
          version=$(sed -n 's/^;; Version: \([0-9][0-9.]*\)$/\1/p' canvas-color-picker.el)
          test -n "$version"
          asset="canvas-color-picker-module-v${version}-linux-x86_64.so"
          cp zig-out/lib/canvas-color-picker-module.so "$asset"
          sha256sum "$asset" > "$asset.sha256"
          sha256sum --check "$asset.sha256"
          mkdir -p release-assets
          mv "$asset" "$asset.sha256" release-assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64
          path: release-assets/
          if-no-files-found: error
