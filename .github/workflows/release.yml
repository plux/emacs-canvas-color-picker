name: Build native module artifact

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Match tag to package version
        shell: bash
        run: |
          version=$(sed -n 's/^;; Version: \([0-9][0-9.]*\)$/\1/p' color-picker.el)
          download_version=$(sed -n 's/^(defconst emacs-canvas-color-picker-version "\([0-9][0-9.]*\)"$/\1/p' color-picker.el)
          test -n "$version"
          test "$version" = "$download_version"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Install verified Zig 0.17.0
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --output /tmp/zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo '1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  /tmp/zig.tar.xz' | sha256sum --check
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo /tmp/zig-x86_64-linux-0.17.0 >> "$GITHUB_PATH"
      - name: Build native module with vendored Emacs 32 header
        run: make build ZIG=zig EMACS_INCLUDE_DIR="$PWD/vendor"
      - name: Package module and checksum
        shell: bash
        run: |
          asset="libcolor-picker-${GITHUB_REF_NAME}-linux-x86_64.so"
          cp zig-out/lib/libcolor-picker.so "$asset"
          sha256sum "$asset" > "$asset.sha256"
          sha256sum --check "$asset.sha256"
          mkdir -p release-assets
          mv "$asset" "$asset.sha256" release-assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64
          path: release-assets/
          if-no-files-found: error
