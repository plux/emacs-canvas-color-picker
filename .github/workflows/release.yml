name: Build native module artifact

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Match tag to package version
        shell: bash
        run: |
          version=$(sed -n 's/^;; Version: \([0-9][0-9.]*\)$/\1/p' canvas-color-picker.el)
          download_version=$(sed -n 's/^(defconst canvas-color-picker-version "\([0-9][0-9.]*\)"$/\1/p' canvas-color-picker.el)
          test -n "$version"
          test "$version" = "$download_version"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "ASSET_TAG=v${version}" >> "$GITHUB_ENV"
      - name: Install Zig 0.17.0 with cache
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: x86_64-linux-gnu.2.35-aarch64-macos-baseline
          use-tool-cache: true
      - name: Build Linux module with vendored Emacs 32 header
        run: zig build -Doptimize=ReleaseFast -Demacs-include-dir=vendor -Dtarget=x86_64-linux-gnu.2.35 -Dcpu=baseline
      - name: Package Linux module and checksum
        shell: bash
        run: |
          asset="canvas-color-picker-module-${ASSET_TAG}-linux-x86_64.so"
          mkdir -p release-assets/linux-x86_64
          cp zig-out/lib/canvas-color-picker-module.so "release-assets/linux-x86_64/$asset"
          (cd release-assets/linux-x86_64 && shasum -a 256 "$asset" > "$asset.sha256" && shasum -a 256 -c "$asset.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64
          path: release-assets/linux-x86_64/
          if-no-files-found: error
      - name: Build macOS ARM64 module with vendored Emacs 32 header
        run: zig build -Doptimize=ReleaseFast -Demacs-include-dir=vendor -Dtarget=aarch64-macos -Dcpu=baseline
      - name: Package macOS ARM64 module and checksum
        shell: bash
        run: |
          asset="canvas-color-picker-module-${ASSET_TAG}-macos-aarch64.so"
          mkdir -p release-assets/macos-aarch64
          cp zig-out/lib/canvas-color-picker-module.so "release-assets/macos-aarch64/$asset"
          (cd release-assets/macos-aarch64 && shasum -a 256 "$asset" > "$asset.sha256" && shasum -a 256 -c "$asset.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-aarch64
          path: release-assets/macos-aarch64/
          if-no-files-found: error
